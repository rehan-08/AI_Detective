[project]
name = "ai-detective"
version = "1.0.0"
description = "An AI detective that solves fictional cases from scattered evidence, with every conclusion traced to a source."
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3,<3", "groq>=1.7,<2", "pydantic>=2.8,<3", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
detective = "detective.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["detective"]

[tool.setuptools.package-data]
detective = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: calls a real model API and costs money"]
